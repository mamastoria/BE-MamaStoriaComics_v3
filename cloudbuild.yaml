steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nanobanana-backend:$COMMIT_SHA",
        ".",
      ]

  # Push the container image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nanobanana-backend:$COMMIT_SHA",
      ]

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "nanobanana-backend-us"
      - "--image"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nanobanana-backend:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "nanobanana-comic-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--add-cloudsql-instances"
      - "$PROJECT_ID:us-central1:cloudsql-nanobanana-us"
      - "--memory"
      - "2Gi"
      - "--timeout"
      - "900"
      - "--set-env-vars"
      - "APP_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_PROJECT_ID=$PROJECT_ID,GOOGLE_BUCKET_NAME=nanobanana-storage,VERTEX_LOCATION=us-central1,USE_CLOUD_SQL_CONNECTOR=true,CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:us-central1:cloudsql-nanobanana-us"
      - "--set-secrets"
      - "SECRET_KEY=SECRET_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest"

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nanobanana-backend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
