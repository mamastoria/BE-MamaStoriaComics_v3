steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nanobanana-backend:latest",
        ".",
      ]

  # Push the container image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nanobanana-backend:latest",
      ]

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "nanobanana-backend"
      - "--image"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nanobanana-backend:latest"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "nanobanana-comic-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--add-cloudsql-instances"
      - "$PROJECT_ID:us-central1:cloudsql-nanobanana-us"
      - "--memory"
      - "2Gi"
      - "--timeout"
      - "600"

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nanobanana-backend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
